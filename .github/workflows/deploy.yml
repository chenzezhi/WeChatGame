name: Deploy WeChat Mini Program

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install miniprogram-ci

      - name: Create Private Key File
        run: |
          cat << 'EOF' > private.key
          ${{ secrets.WECHAT_PRIVATE_KEY }}
          EOF
          cp private.key private.${{ secrets.WECHAT_APPID }}.key

      - name: Run Preview Script
        run: node upload.js
        env:
          WX_APPID: ${{ secrets.WECHAT_APPID }}

      - name: Upload QR Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-qr-code
          path: qrcode.jpg