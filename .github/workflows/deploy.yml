name: Deploy WeChat Mini Program

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install miniprogram-ci

      - name: Create Private Key Files
        run: |
          # 1. 生成通用名的 private.key
          cat << 'EOF' > private.key
          ${{ secrets.WECHAT_PRIVATE_KEY }}
          EOF

          # 2. 同时生成带 AppID 前缀的文件名（确保微信默认查找规则能匹配到）
          cp private.key private.${{ secrets.WECHAT_APPID }}.key

      - name: Run Upload Script
        run: node upload.js
