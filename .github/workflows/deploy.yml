name: Deploy WeChat Mini Program

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install miniprogram-ci

      - name: Create Private Key File
        run: |
          cat << 'EOF' > private.key
          ${{ secrets.WECHAT_PRIVATE_KEY }}
          EOF

      - name: Generate Preview QR Code
        run: |
          # 使用 preview 命令生成带二维码的预览，并直接在终端以字符画形式输出
          npx miniprogram-ci preview \
            --pp ./ \
            --pkp ./private.key \
            --appid ${{ secrets.WECHAT_APPID }} \
            --uv 1.0.0 \
            --ud "CI Preview QR Code" \
            --qrcode-format terminal \
            --qrcode-output-dest terminal \
            -r 1