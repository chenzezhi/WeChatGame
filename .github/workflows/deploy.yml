name: Deploy WeChat Mini Program

on:
  push:
    branches:
      - main  # 如果你的默认分支是 master，请把这里改成 master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install miniprogram-ci
        run: npm install miniprogram-ci --save-dev

      - name: Create Private Key File
        run: |
          echo "${{ secrets.MINIPROGRAM_PRIVATE_KEY }}" > private.key

      - name: Upload to WeChat
        run: |
          # 1. 将 Secrets 里的密钥写入临时文件
          echo "${{ secrets.WECHAT_PRIVATE_KEY }}" > private.key

          # 2. 调用 miniprogram-ci 上传
          npx miniprogram-ci upload \
          --pp ./ \
          --pkp ./private.key \
          --appid ${{ secrets.WECHAT_APPID }} \
          --uv 1.0.0 \
          --ud "Automated deployment via GitHub Actions" \
          -r 1
