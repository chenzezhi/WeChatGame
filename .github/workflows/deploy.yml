name: Deploy WeChat Mini Program

on:
  push:
    branches:
      - main  # 如果你的主分支叫 master，请改成 master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install miniprogram-ci

      - name: Create Private Key File
        run: |
          cat << 'EOF' > private.key
          ${{ secrets.WECHAT_PRIVATE_KEY }}
          EOF

      - name: Run Upload & Preview Script
        run: node upload.js
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}